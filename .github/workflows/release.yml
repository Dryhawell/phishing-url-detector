name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release notes
        id: notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILE="docs/RELEASE_${TAG}.md"
          if [ -f "$FILE" ]; then
            echo "Using $FILE"
            {
              echo "body<<EOF"
              cat "$FILE"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "Fallback to CHANGELOG excerpt"
            {
              echo "body<<EOF"
              echo "## ${TAG}"
              echo
              echo "See CHANGELOG.md for full details."
              echo
              sed -n "/^## \[${TAG#v}\]/,/^## \[/p" CHANGELOG.md | sed '$d'
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
